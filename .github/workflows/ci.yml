name: CI
on: [push, pull_request]

# This repo ships three independent implementations of the same MCP server
# (typescript/, go/, python/) and has no root package.json. The previous
# workflow ran `npm ci` at the root, which failed in setup-node before it
# ever got that far: `cache: npm` needs a lockfile at the cache-dependency
# path and there is none at the root.
jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum
      - run: go build ./...
      - run: go vet ./...
      # No _test.go files in this module yet; `go test` is kept so coverage
      # starts running automatically as soon as tests are added.
      - run: go test ./...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python -m compileall -q src
